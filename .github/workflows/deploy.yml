name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-aws:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: ansible-playbook -i inventory.ini site.yml --syntax-check
      - name: Deploy to AWS
        run: ansible-playbook -i inventory.ini site.yml --limit aws
      - name: Health check
        run: curl -fsS http://13.233.117.123/health

  deploy-onprem:
    runs-on: self-hosted
    needs: deploy-aws
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to on-prem
        run: ansible-playbook -i inventory.ini site.yml --limit onprem
      - name: Health check
        run: curl -fsS --resolve anjshahb.duckdns.org:443:127.0.0.1 https://anjshahb.duckdns.org/health
